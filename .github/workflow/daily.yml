name: video-bot

on:
  schedule:
    # 03:00 IST on Tue, Thu, Sat, Sun = 21:30 UTC on Mon, Wed, Fri, Sat (cron runs in UTC).
    # For every day at 03:00 IST use: "30 21 * * *"
    - cron: "30 21 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = make a video, check = health check only"
        default: "full"
        type: choice
        options: [full, check]

permissions:
  contents: write

concurrency:
  group: video-bot
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fonts and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core libraqm0 libfribidi0
          pip install -r requirements.txt
          ffmpeg -version | head -1

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # telegram = video comes to you on Telegram (safe default)
          # youtube  = bot uploads to YouTube as private (only after YouTube API audit passes)
          UPLOAD_MODE: ${{ vars.UPLOAD_MODE || 'telegram' }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then
            python bot.py --check
          else
            python bot.py
          fi

      - name: Keep a copy of the video for 3 days
        if: success() && github.event.inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: work/out/*
          retention-days: 3
          if-no-files-found: ignore

      - name: Save progress (so topics never repeat)
        if: success() && github.event.inputs.mode != 'check'
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add state
          git commit -m "state: new video done" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
          
