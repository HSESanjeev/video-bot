name: video-bot

on:
  schedule:
    # 03:00 IST on Tue, Thu, Sat, Sun = 21:30 UTC on Mon, Wed, Fri, Sat (cron runs in UTC).
    # For every day at 03:00 IST use: "30 21 * * *"
    - cron: "30 21 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = make a video, check = health check, voices = send voice samples"
        default: "full"
        type: choice
        options: [full, check, voices]

permissions:
  contents: write

concurrency:
  group: video-bot
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fonts and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0
          pip install -r requirements.txt numpy scipy
          ffmpeg -version | head -1
          # nicer Hindi fonts (free, Google Fonts). If a download fails the bot uses the Noto font instead.
          mkdir -p fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          for f in mukta/Mukta-ExtraBold.ttf mukta/Mukta-Bold.ttf yatraone/YatraOne-Regular.ttf khand/Khand-Bold.ttf rozhaone/RozhaOne-Regular.ttf modak/Modak-Regular.ttf; do
            curl -fsSL --retry 2 -o "fonts/$(basename $f)" "$B/$f" || echo "font $f not downloaded"
          done
          ls -la fonts
          # real world-map coastlines for map scenes (if this fails the bot uses simple built-in outlines)
          curl -fsSL --retry 2 -o land.json https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_land.geojson || echo "map data not downloaded"

      - name: Local AI pictures (free, no quota) - only used when Cloudflare is out of quota
        if: github.event.inputs.mode != 'voices'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu || echo "torch not installed"
          pip install diffusers transformers accelerate safetensors || echo "diffusers not installed"

      - name: Remember downloaded model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sd-turbo-v1

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'auto' }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Charon' }}
          # telegram = video comes to you on Telegram (safe default)
          # youtube  = bot uploads to YouTube as private (only after YouTube API audit passes)
          UPLOAD_MODE: ${{ vars.UPLOAD_MODE || 'telegram' }}
          # short test videos while testing (seconds). Set Variable TEST_SECONDS = 0 for normal 3-5 minute videos.
          TEST_SECONDS: ${{ vars.TEST_SECONDS || '30' }}
          # your own topic or full story (Variable CUSTOM_STORY). Value 0 or empty = automatic topic as usual
          CUSTOM_STORY: ${{ vars.CUSTOM_STORY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then
            python bot.py --check
          elif [ "${{ github.event.inputs.mode }}" = "voices" ]; then
            python bot.py --voices
          else
            python bot.py
          fi

      - name: Keep a copy of the video for 3 days
        if: success() && github.event.inputs.mode != 'check' && github.event.inputs.mode != 'voices'
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: work/out/*
          retention-days: 3
          if-no-files-found: ignore

      - name: Save progress (so topics never repeat)
        if: success() && github.event.inputs.mode != 'check' && github.event.inputs.mode != 'voices'
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add state
          git commit -m "state: new video done" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
          
