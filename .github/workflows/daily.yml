name: video-bot

on:
  schedule:
    # 01:00 AM IST on Tue, Thu, Sat, Sun = 19:30 UTC on Mon, Wed, Fri, Sat (GitHub cron runs in UTC; IST = UTC + 5:30).
    # For EVERY day at 01:00 AM IST use: "30 19 * * *"
    # (GitHub may start a scheduled run 5-30 minutes late when it is busy - that is normal. :30 is used on purpose: the full hour is the busiest.)
    - cron: "30 19 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = make a video, check = health check, voices = send voice samples"
        default: "full"
        type: choice
        options: [full, check, voices]
      custom_story:
        description: "OPTIONAL: your own topic or full story (any language). Leave EMPTY = bot picks its own topic as usual"
        required: false
        default: ""
        type: string
      video_seconds:
        description: "Video length in SECONDS: the video is made this long, whatever the story length (30 = quick test, 600 = 10 minutes)"
        required: false
        default: "600"
        type: choice
        options: ["30", "60", "120", "180", "240", "300", "420", "600", "900", "1200"]

permissions:
  contents: write
  actions: write

concurrency:
  group: video-bot
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fonts and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0
          pip install -r requirements.txt numpy scipy
          ffmpeg -version | head -1
          # nicer Hindi fonts (free, Google Fonts). If a download fails the bot uses the Noto font instead.
          mkdir -p fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          for f in mukta/Mukta-ExtraBold.ttf mukta/Mukta-Bold.ttf yatraone/YatraOne-Regular.ttf khand/Khand-Bold.ttf rozhaone/RozhaOne-Regular.ttf modak/Modak-Regular.ttf ptserif/PT_Serif-Web-Bold.ttf specialelite/SpecialElite-Regular.ttf bebasneue/BebasNeue-Regular.ttf anton/Anton-Regular.ttf poppins/Poppins-Bold.ttf poppins/Poppins-SemiBold.ttf poppins/Poppins-Medium.ttf poppins/Poppins-Regular.ttf; do
            curl -fsSL --retry 2 -o "fonts/$(basename $f)" "$B/$f" || echo "font $f not downloaded"
          done
          ls -la fonts
          # real world-map coastlines for map scenes (if this fails the bot uses simple built-in outlines)
          curl -fsSL --retry 2 -o land.json https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_land.geojson || echo "map data not downloaded"

      - name: Local AI pictures (free, no quota) - only used when Cloudflare is out of quota
        if: github.event.inputs.mode != 'voices'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu || echo "torch not installed"
          pip install diffusers transformers accelerate safetensors || echo "diffusers not installed"

      - name: Remember downloaded model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sd-turbo-v1

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # backup Gemini keys (optional): when the first key hits its limit (HTTP 429) the bot switches to the next one by itself
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'auto' }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Charon' }}
          # telegram = video comes to you on Telegram (safe default)
          # youtube  = bot uploads to YouTube as private (only after YouTube API audit passes)
          UPLOAD_MODE: ${{ vars.UPLOAD_MODE || 'telegram' }}
          # video length in seconds: the length picked when you press "Run workflow"; the AUTOMATIC 01:00 AM runs use Variable VIDEO_SECONDS (default 600 = 10 minutes)
          VIDEO_SECONDS: ${{ github.event.inputs.video_seconds || vars.VIDEO_SECONDS || vars.TEST_SECONDS || '600' }}
          # your own topic or full story (Variable CUSTOM_STORY). Value 0 or empty = automatic topic as usual
          CUSTOM_STORY: ${{ github.event.inputs.custom_story || vars.CUSTOM_STORY }}
          # speed guards (the job is cancelled after 240 min): optional Gemini calls pause when Gemini is slow, picture work stops early
          OPTIONAL_LLM_MAX: ${{ vars.OPTIONAL_LLM_MAX || '150' }}
          LOCAL_SD_MAX: ${{ vars.LOCAL_SD_MAX || '30' }}
          MAX_EXPLAIN_PNG: ${{ vars.MAX_EXPLAIN_PNG || '30' }}
          # TRUE-STORY channel (reference-video look). Change a Variable only if you want to go back:
          #   TOPIC_MODE = story (real documented stories with trusted sources) | science (the old nature / science topics)
          TOPIC_MODE: ${{ vars.TOPIC_MODE || 'story' }}
          PLAIN: ${{ vars.PLAIN || '0' }}                       # 0 = editing techniques ON (cards, year slider, labels, transitions); 1 = plain pictures only
          CAST: ${{ vars.CAST || '1' }}                         # 1 = same people / same village in every picture (AI-only pictures for stories)
          REF_ONLY: ${{ vars.REF_ONLY || '1' }}                 # 1 = only overlays that exist in the reference video
          TRUSTED_ONLY: ${{ vars.TRUSTED_ONLY || '1' }}         # 1 = source cards only from trusted organisations
          STRICT_SOURCES: ${{ vars.STRICT_SOURCES || '1' }}     # 1 = a source card only when its text supports what the narrator says
        run: |
          if [ "${{ github.event.inputs.mode }}" = "check" ]; then
            python bot.py --check
          elif [ "${{ github.event.inputs.mode }}" = "voices" ]; then
            python bot.py --voices
          else
            python bot.py
          fi

      - name: Keep a copy of the video for 3 days
        if: success() && github.event.inputs.mode != 'check' && github.event.inputs.mode != 'voices'
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: work/out/*
          retention-days: 3
          if-no-files-found: ignore

      - name: Save progress (so topics never repeat)
        if: success() && github.event.inputs.mode != 'check' && github.event.inputs.mode != 'voices'
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add state
          git commit -m "state: new video done" || echo "nothing to commit"
          git pull --rebase || true
          git push || true

      - name: Keep the automatic schedule switched on
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub switches scheduled workflows off after 60 days without repository activity; this re-enables it if that ever happened
          WF="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          gh api -X PUT "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF}/enable" || echo "could not call enable (ignored)"
